plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content {
            includeGroup 'fuzs.forgeconfigapiport'
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        simplebackups {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file('src/main/resources/simplebackups.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    // Minecraft exposes this to compilation, but not to Fabric's game classloader.
    // ZSTD archives and their merger use its TAR streams at runtime.
    include implementation('org.apache.commons:commons-compress:1.28.0')
    include implementation('org.tukaani:xz:1.12')
    include implementation('com.github.luben:zstd-jni:1.5.7-7')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }

    from('NOTICE') {
        rename { "${it}_${project.archives_base_name}" }
    }

    from('licenses/zstd-jni.txt') {
        into('META-INF/LICENSES')
    }

    from('licenses/xz.txt') {
        into('META-INF/LICENSES')
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
