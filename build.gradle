plugins {
    id 'org.moddingx.modgradle.meta' version '5.1.1'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

var dev = System.getenv('IS_DEV')?.toBoolean() ?: false
var releaseType = 'beta'
var baseVersion = '26.1'
var cherishedWorldsVersion = 'Fik98aS8' // 13.0.1+1.21.8

mod.configure {
    modid 'simplebackups'
    group 'de.melanx'
    versioning {
        if (dev) {
            def gitCommitHash = ['git', 'rev-parse', 'HEAD'].execute().text.trim()
            constant baseVersion + '.999' + (gitCommitHash ? "-${gitCommitHash}" : '')
        } else {
            base baseVersion
            maven 'https://maven.melanx.de/release'
        }
    }

    neoforge "${baseVersion}.0.0-alpha.15+pre-3"

    license 'The Apache License, Version 2.0'
    github 'ChaoticTrials/SimpleBackups'

    artifacts {
        sources {
            publishToRepositories()
        }
    }

    changelog {
        def lines = defaultChangelog.toString().split('\n')
        def filteredChangelog = lines.findAll { !it.startsWith('- [[meta]') }.join('\n')

        return filteredChangelog
    }


    publishing {
        maven {
            name 'melanx'
            url 'https://maven.melanx.de/release'
            credentials(PasswordCredentials)
        }
    }

    upload {
        all {
            type releaseType
            version '26.1'
            optional 'cherished-worlds'
        }
        curseforge {
            projectId 583228
        }
        modrinth {
            projectId 'fzSKSXVK'
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:cherished-worlds:${cherishedWorldsVersion}"
}
